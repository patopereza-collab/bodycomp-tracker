name: Keep Supabase Alive

# Genera actividad en el proyecto Supabase. OJO con las expectativas:
#
# El plan free pausa un proyecto que no ve "sufficient activity" por más de
# 7 días (texto literal del aviso de Supabase). Un ping diario NO alcanza:
# está comprobado — del 2026-08-03 al 2026-09-10 este workflow escribió todos
# los días con status 200 y el proyecto se pausó igual el 2026-09-11, y volvió
# a pasar en octubre. Por eso ahora hace varias consultas por corrida en vez de
# un ping simbólico.
#
# QUIÉN DES-PAUSA: no este workflow. Un agente programado en la nube
# ("Supabase keep-alive — des-pausar proyectos", cada 6 h) revisa este proyecto
# y registro-medidores, y los restaura vía Management API cuando los encuentra
# pausados. No depende de ningún PC encendido ni de un PAT guardado acá.
#
# POR QUÉ ESTE JOB NUNCA FALLA: antes salía en rojo todos los días que el
# proyecto estaba pausado, y eso generaba un mail de GitHub por día sin aportar
# nada, porque la recuperación no vive acá. Ahora deja el diagnóstico como
# warning en el log y termina en verde.

on:
  schedule:
    - cron: '0 8 * * *' # todos los días 08:00 UTC
  workflow_dispatch:

env:
  SUPABASE_URL: https://fcvwnussrbdydxxbydth.supabase.co

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar actividad en Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZjdndudXNzcmJkeWR4eGJ5ZHRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNTI2MDUsImV4cCI6MjA5MjcyODYwNX0.3709eZcYol43OCZuD1hb7jgTPbyhaIvRsTd16wHNMQQ' }}
        run: |
          # Confirmar que responde, con reintentos por si está reactivándose
          # (COMING_UP devuelve 404/502/544 transitorios).
          alive=0
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null --max-time 20 -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo 000)
            echo "Intento $attempt — HTTP $status"
            case "$status" in
              200|206|406) alive=1; break ;;
            esac
            echo "  no-OK, reintento en 30s..."
            sleep 30
          done

          if [ "$alive" -ne 1 ]; then
            echo "::warning::Supabase no respondió — el proyecto está pausado."
            echo "La rutina en la nube 'Supabase keep-alive' lo des-pausa sola (corre cada 6 h)."
            echo "Este job no falla a propósito: la recuperación no vive acá."
            exit 0
          fi

          # Actividad real: varias consultas con trabajo, no un ping simbólico.
          echo "Proyecto activo — generando actividad..."
          for q in \
            "profiles?select=*" \
            "measurements?select=*&order=fecha_medicion.desc&limit=100" \
            "measurements?select=peso,grasa_pct&limit=300" ; do
            code=$(curl -s -o /dev/null --max-time 25 -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/$q" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY" || echo 000)
            echo "  $q → $code"
          done

          # keepalive() es un write chico vía RPC; si no existe, no pasa nada.
          rpc=$(curl -s -o /dev/null --max-time 25 -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' || echo 000)
          echo "  rpc/keepalive → $rpc"
          echo "✓ Actividad generada"
